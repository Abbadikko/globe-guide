name: Build Globe Guide APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev ccache

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Set up Android SDK
        run: |
          BUILDOZER_SDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $BUILDOZER_SDK/cmdline-tools
          cd $HOME
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools $BUILDOZER_SDK/cmdline-tools/latest

          export ANDROID_SDK_ROOT=$BUILDOZER_SDK
          SDKMANAGER=$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager

          # Accept licenses and install components
          yes | $SDKMANAGER --sdk_root=$BUILDOZER_SDK --licenses
          $SDKMANAGER --sdk_root=$BUILDOZER_SDK \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          # Create old-style tools/bin path that Buildozer expects
          mkdir -p $BUILDOZER_SDK/tools/bin
          ln -sf $BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager \
                 $BUILDOZER_SDK/tools/bin/sdkmanager
          ln -sf $BUILDOZER_SDK/cmdline-tools/latest/bin/avdmanager \
                 $BUILDOZER_SDK/tools/bin/avdmanager

          echo "✅ SDK setup complete"
          ls $BUILDOZER_SDK/build-tools/
          ls $BUILDOZER_SDK/tools/bin/

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          buildozer android debug 2>&1

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: globe-guide-apk
          path: bin/*.apk
          retention-days: 7
