name: Build Globe Guide APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache

      - name: Install Buildozer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36 \
            virtualenv

      - name: Prepare compatible python-for-android
        run: |
          rm -rf .buildozer ~/.buildozer python-for-android

          git clone \
            https://github.com/kivy/python-for-android.git \
            python-for-android

          cd python-for-android

          if git ls-remote --exit-code --tags origin "refs/tags/2023.09.16" >/dev/null 2>&1; then
            git fetch --depth 1 origin tag 2023.09.16
            git checkout --detach 2023.09.16
          elif git ls-remote --exit-code --tags origin "refs/tags/v2023.09.16" >/dev/null 2>&1; then
            git fetch --depth 1 origin tag v2023.09.16
            git checkout --detach v2023.09.16
          else
            echo "Compatible python-for-android tag 2023.09.16 was not found"
            exit 1
          fi

          python -m pip install .
          echo "python-for-android commit:"
          git rev-parse HEAD
          python -m pip show python-for-android

      - name: Fix sdkmanager path for Buildozer
        run: |
          sudo mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
          sudo ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
          sudo ln -sf \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager" \
            "$ANDROID_SDK_ROOT/tools/bin/avdmanager"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Force Buildozer to use compatible python-for-android
        run: |
          printf '\np4a.source_dir = %s\n' \
            "$GITHUB_WORKSPACE/python-for-android" >> buildozer.spec

      - name: Build APK
        env:
          ANDROIDSDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROIDNDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROIDAPI: '33'
          ANDROIDMINAPI: '21'
        run: |
          rm -rf .buildozer
          buildozer android debug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: globe-guide-apk
          path: bin/*.apk
          retention-days: 7
