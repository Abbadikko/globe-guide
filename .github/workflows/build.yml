name: Build Globe Guide APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev ccache

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Fix sdkmanager path for Buildozer
        run: |
          # Buildozer looks for sdkmanager in old tools/bin location
          # Create symlink from old path to new cmdline-tools path
          sudo mkdir -p $ANDROID_SDK_ROOT/tools/bin
          sudo ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
                      $ANDROID_SDK_ROOT/tools/bin/sdkmanager
          sudo ln -sf $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager \
                      $ANDROID_SDK_ROOT/tools/bin/avdmanager

          # Accept all licenses
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses

          # Verify
          echo "sdkmanager at tools/bin:"
          ls -la $ANDROID_SDK_ROOT/tools/bin/
          echo "build-tools:"
          ls $ANDROID_SDK_ROOT/build-tools/

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build APK
        run: |
          export ANDROIDSDK=$ANDROID_SDK_ROOT
          export ANDROIDNDK=/usr/local/lib/android/sdk/ndk/27.3.13750724
          export ANDROIDAPI=33
          export ANDROIDMINAPI=21
          buildozer android debug 2>&1

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: globe-guide-apk
          path: bin/*.apk
          retention-days: 7
